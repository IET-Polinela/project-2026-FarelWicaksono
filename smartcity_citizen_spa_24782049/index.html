<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Citizen Portal Smart City - SPA Vanilla JavaScript">
  <title>Citizen Portal | Smart City</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark portal-navbar sticky-top shadow-sm">
    <div class="container-fluid px-3 px-lg-4">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#dashboard">
        <span class="brand-mark"><i class="bi bi-buildings-fill"></i></span>
        <span>Citizen Portal</span>
      </a>
      <div id="nav-menus" class="d-flex align-items-center gap-2"></div>
    </div>
  </nav>

  <main id="app-content" class="container-fluid px-3 px-lg-4 py-4" aria-live="polite">
    <div class="d-flex justify-content-center align-items-center min-vh-50">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Memuat aplikasi...</span>
      </div>
    </div>
  </main>

  <!-- Modal tambah/edit laporan. Semua tombol aksi bertipe button agar SPA tidak reload. -->
  <div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header">
          <div>
            <p class="section-title mb-1">Manajemen Laporan</p>
            <h2 class="modal-title fs-5 fw-bold" id="reportModalLabel">Buat Laporan Baru</h2>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body p-4">
          <div id="reportFormAlert" class="alert alert-danger d-none" role="alert"></div>
          <form id="reportForm" novalidate>
            <div class="row g-3">
              <div class="col-12 col-md-8">
                <label for="inputTitle" class="form-label fw-semibold">Judul laporan</label>
                <input type="text" class="form-control" id="inputTitle" maxlength="200" required>
                <div class="invalid-feedback">Judul laporan wajib diisi.</div>
              </div>
              <div class="col-12 col-md-4">
                <label for="inputCategory" class="form-label fw-semibold">Kategori</label>
                <select class="form-select" id="inputCategory" required>
                  <option value="">Pilih kategori</option>
                  <option value="Infrastruktur">Infrastruktur</option>
                  <option value="Jalan Rusak">Jalan Rusak</option>
                  <option value="Drainase">Drainase</option>
                  <option value="Lampu Mati">Lampu Mati</option>
                  <option value="Sampah">Sampah</option>
                  <option value="Keamanan">Keamanan</option>
                  <option value="Umum">Umum</option>
                </select>
                <div class="invalid-feedback">Kategori wajib dipilih.</div>
              </div>
              <div class="col-12">
                <label for="inputLocation" class="form-label fw-semibold">Lokasi</label>
                <input type="text" class="form-control" id="inputLocation" maxlength="200" required>
                <div class="invalid-feedback">Lokasi laporan wajib diisi.</div>
              </div>
              <div class="col-12">
                <label for="inputDescription" class="form-label fw-semibold">Deskripsi</label>
                <textarea class="form-control" id="inputDescription" rows="5" required></textarea>
                <div class="invalid-feedback">Deskripsi laporan wajib diisi.</div>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer flex-column flex-sm-row">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
            <i class="bi bi-x-lg me-1"></i>Batal
          </button>
          <button type="button" class="btn btn-outline-primary" id="btnDraft">
            <span class="action-label"><i class="bi bi-save me-1"></i>Simpan Draft</span>
            <span class="action-loading d-none"><span class="spinner-border spinner-border-sm me-2"></span>Menyimpan...</span>
          </button>
          <button type="button" class="btn btn-primary" id="btnSubmit">
            <span class="action-label"><i class="bi bi-send me-1"></i>Ajukan</span>
            <span class="action-loading d-none"><span class="spinner-border spinner-border-sm me-2"></span>Mengirim...</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <footer class="portal-footer py-4 mt-auto">
    <div class="container-fluid px-3 px-lg-4 d-flex flex-column flex-md-row justify-content-between gap-2">
      <span><i class="bi bi-shield-check me-1"></i> Citizen Portal Smart City</span>
      <span>Lab Session 12 &middot; NPM 24782049</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
</body>
</html>
