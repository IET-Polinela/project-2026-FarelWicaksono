{% extends 'base.html' %}
{% block title %}Registrasi Citizen - Bimasakti City{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="fw-bold text-center text-success mb-4">📝 Registrasi Citizen</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100 fw-semibold py-2 shadow-sm mt-3">Daftar Sekarang</button>
                </form>
                <div class="text-center mt-3">
                    <small class="text-muted">Sudah punya akun? <a href="{% url 'login' %}" class="text-decoration-none">Login di sini</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
