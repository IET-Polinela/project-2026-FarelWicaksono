<!DOCTYPE html>
<html>
<head>

            justify-content: space-between;

            padding: 10px 20px;
            border-bottom: 2px solid #333; /* Garis Line sesuai sketsa */
            font-family: Arial, sans-serif;
        }
        .nav-items a {
            padding: 10px 15px;
            text-decoration: none;

        }
    </style>
</head>
<body>

        <div class="welcome-text" style="font-weight: bold;">Hubungi Kami</div>
        <div class="nav-items">
            <a href="/">Home</a>

            <a href="/contacts/">Contacts</a>

    </div>

</html>
